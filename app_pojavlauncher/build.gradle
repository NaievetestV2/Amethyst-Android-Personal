plugins {
    id 'com.android.application' version '8.7.2'
}

static def getDate() { return new Date().format('yyyyMMdd') }

def getVersionName() {
    def tag = new ByteArrayOutputStream()
    def branch = new ByteArrayOutputStream()
    def tagPartCommit = new ByteArrayOutputStream()

    // Use a try-catch block to handle the exec command.
    try {
        exec {
            commandLine 'git', 'describe', '--tags'
            ignoreExitValue true
            standardOutput = tag
        }
    } catch (Exception e) {
        e.printStackTrace()
    }

    if (tag.toString().trim() == "") {
        try {
            exec {
                commandLine 'git', 'describe', '--always', '--tags'
                ignoreExitValue true
                standardOutput = tagPartCommit
            }
        } catch (Exception e) {
            e.printStackTrace()
        }
    }

    String tagString
    if (tag.toString().trim() != "") {
        tagString = tag.toString().trim()
    } else {
        if (tagPartCommit.toString().trim() == "") {
            // Fallback if no git repo is found
            return ("LOCAL-" + getDate())
        } else {
            // Used by github actions
            tagString = 'amethyst-legacy-' + getDate() + "-" + tagPartCommit.toString().trim()
        }
    }

    try {
        exec {
            commandLine 'git', 'branch', '--show-current'
            ignoreExitValue true
            standardOutput = branch
        }
    } catch (Exception e) {
        e.printStackTrace()
    }

    return tagString.replace("-g", "-") + "-" + branch.toString().trim()
}


static def getDateSeconds() {
    if (System.getenv("GITHUB_ACTIONS") == "true") {
        return 9934841 + Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER"))
    } else {
        return 172005
    }
}

def getCFApiKey() {
    String key = System.getenv("CURSEFORGE_API_KEY")
    if(key != null) return key
    File curseforgeKeyFile = new File("./curseforge_key.txt")
    if(curseforgeKeyFile.canRead() && curseforgeKeyFile.isFile()) {
        return curseforgeKeyFile.text
    }
    logger.warn('BUILD: You have no CurseForge key, the curseforge api will get disabled !')
    return "DUMMY"
}

configurations {
    instrumentedClasspath {
        canBeConsumed = false
        canBeResolved = true
    }
}

android {
    namespace = 'net.kdt.pojavlaunch'
    compileSdk = 34
    lintOptions {
        abortOnError = false
    }
    signingConfigs {
        customDebug {
            storeFile = file("debug.keystore")
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
        }
        googlePlayBuild {
            storeFile = file("upload.jks")
            storePassword = System.getenv("GPLAY_KEYSTORE_PASSWORD")
            keyAlias = "upload"
            keyPassword = System.getenv("GPLAY_KEYSTORE_PASSWORD")
        }
    }
    defaultConfig {
        applicationId = "org.angelauramc.amethyst"
        minSdkVersion = 21
        targetSdkVersion = 34
        versionCode = getDateSeconds()
        versionName = getVersionName()
        multiDexEnabled = true
        resValue 'string', 'curseforge_api_key', getCFApiKey()
    }
    buildTypes {
        debug {
            applicationIdSuffix = '.debug'
            minifyEnabled = false
            shrinkResources = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.customDebug
            resValue 'string', 'application_package', 'org.angelauramc.amethyst.debug'
            resValue 'string', 'storageProviderAuthorities', 'org.angelauramc.amethyst.scoped.gamefolder.debug'
            resValue 'string', 'shareProviderAuthority', 'org.angelauramc.amethyst.scoped.controlfolder.debug'
        }
        proguard {
            initWith = proguard
            minifyEnabled = true
            shrinkResources = true
        }
        proguardNoDebug {
            initWith = proguard
            debuggable = false
        }
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            resValue 'string', 'storageProviderAuthorities', 'org.angelauramc.amethyst.scoped.gamefolder'
            resValue 'string', 'application_package', 'org.angelauramc.amethyst'
        }
        gplay {
            initWith = release
            signingConfig = signingConfigs.googlePlayBuild
            matchingFallbacks = ['release']
        }
    }
    ndkVersion = "25.2.9519653"
    externalNativeBuild {
        ndkBuild {
            path = file('src/main/jni/Android.mk')
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    bundle {
        language {
            enableSplit = false
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        pickFirst '**/libbytehook.so'
    }
    buildFeatures {
        prefab = true
        buildConfig = true
    }
    buildToolsVersion = '34.0.0'
}

afterEvaluate {
    tasks.mergeDebugAssets.dependsOn(":forge_installer:jar", ":arc_dns_injector:jar", ":jre_lwjgl3glfw:jar")
}

dependencies {
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    implementation 'commons-codec:commons-codec:1.15'
    implementation 'androidx.preference:preference:1.2.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0-beta01'
    implementation 'androidx.annotation:annotation:1.5.0'
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation 'com.github.duanhong169:checkerboarddrawable:1.0.2'
    implementation 'com.github.PojavLauncherTeam:portrait-sdp:ed33e89cbc'
    implementation 'com.github.PojavLauncherTeam:portrait-ssp:6c02fd739b'
    implementation 'com.github.Mathias-Boulay:ExtendedView:1.0.0'
    implementation 'com.github.Mathias-Boulay:android_gamepad_remapper:2.0.3'
    implementation 'com.github.Mathias-Boulay:virtual-joystick-android:1.14'
    implementation 'org.tukaani:xz:1.8'
    implementation 'net.sourceforge.htmlcleaner:htmlcleaner:2.6.1'
    implementation 'com.bytedance:bytehook:1.0.9'
    implementation 'top.fifthlight.touchcontroller:proxy-client-android:0.0.4'
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation project(":MobileGlues")
}
